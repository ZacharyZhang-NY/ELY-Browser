[workspace]
members = [
    "crates/ely_app",
    "crates/ely_browser_core",
    "crates/ely_design_system",
    "crates/ely_domain",
    "crates/ely_servo_host",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
dpi = "0.1"
gpui = "0.2.2"
gpui-component = "0.5.1"
servo = "0.1.0"
thiserror = "2.0.12"
url = "2.5.4"
uuid = { version = "1.12.1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
large_futures = "warn"
large_stack_frames = "warn"
